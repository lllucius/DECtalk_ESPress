name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          # Find the latest semver tag (vX.Y.Z), if any
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                     | sort -V | tail -1)

          if [[ -z "${latest}" ]]; then
            next="v0.1.0"
          else
            # Increment patch component
            base="${latest#v}"
            major="${base%%.*}"; rest="${base#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "tag=${next}" >> "${GITHUB_OUTPUT}"
          echo "title=DECtalk ESPress ${next}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.title }}" \
            --generate-notes

  build:
    name: Build ${{ matrix.language.name }}
    runs-on: ubuntu-latest
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        language:
          - code: us
            name: us-english
            symbol: CONFIG_DECTALK_LANG_US
          - code: uk
            name: uk-english
            symbol: CONFIG_DECTALK_LANG_UK
          - code: sp
            name: spanish
            symbol: CONFIG_DECTALK_LANG_SP
          - code: gr
            name: german
            symbol: CONFIG_DECTALK_LANG_GR
          - code: la
            name: latin-american-spanish
            symbol: CONFIG_DECTALK_LANG_LA
          - code: fr
            name: french
            symbol: CONFIG_DECTALK_LANG_FR

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Write release sdkconfig overrides
        shell: bash
        run: |
          cat > sdkconfig.release <<EOF
          ${{ matrix.language.symbol }}=y
          CONFIG_DECTALK_DICT_EMBED=y
          EOF

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          command: >
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="release-artifacts/${{ matrix.language.code }}"
          mkdir -p "${artifact_root}/bootloader" "${artifact_root}/partition_table" "${artifact_root}/dicts"

          cp build/dectalk_espress.bin "${artifact_root}/"
          cp build/bootloader/bootloader.bin "${artifact_root}/bootloader/"
          cp build/partition_table/partition-table.bin "${artifact_root}/partition_table/"
          cp build/flash_args "${artifact_root}/"
          cp sdkconfig "${artifact_root}/"
          cp sdkconfig.release "${artifact_root}/"

          archive="${PWD}/release-artifacts/dectalk-espress-${{ matrix.language.code }}.tar.gz"
          tar -C release-artifacts -czf "${archive}" "${{ matrix.language.code }}"
          echo "archive=${archive}" >> "${GITHUB_ENV}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dectalk-espress-${{ matrix.language.code }}
          path: ${{ env.archive }}
          if-no-files-found: error

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          lang="${{ matrix.language.code }}"
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
            "${{ env.archive }}" \
            --clobber

  deploy_pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [prepare_release, build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ github.token }}

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: Build HTML pages from Markdown
        shell: bash
        run: |
          set -euo pipefail

          convert() {
            local src="$1" dst="$2" title="$3"
            python3 pages/strip-frontmatter.py --rewrite-links "$src" \
              | pandoc \
                  --from gfm \
                  --to html5 \
                  --template pages/template.html \
                  --metadata title="$title" \
                  --standalone \
                  --wrap=none \
                  --output "$dst"
          }

          mkdir -p /tmp/build/components/dectalk /tmp/build/host

          convert README.md                    /tmp/build/index.html                       "DECtalk ESPress"
          convert README.md                    /tmp/build/README.html                      "DECtalk ESPress"
          convert BUILD.md                     /tmp/build/BUILD.html                       "DECtalk ESPress — Build"
          convert components/dectalk/README.md /tmp/build/components/dectalk/README.html   "DECtalk Component"
          convert components/dectalk/BUILD.md  /tmp/build/components/dectalk/BUILD.html    "DECtalk Component — Build"
          convert host/README.md               /tmp/build/host/README.html                 "DECtalk Host Tools"

      - name: Deploy firmware to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.prepare_release.outputs.tag }}"

          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save site files from the current branch
          cp /tmp/build/index.html /tmp/site-index.html
          cp /tmp/build/README.html /tmp/site-README.html
          cp /tmp/build/BUILD.html /tmp/site-BUILD.html
          cp /tmp/build/components/dectalk/README.html /tmp/site-comp-README.html
          cp /tmp/build/components/dectalk/BUILD.html /tmp/site-comp-BUILD.html
          cp /tmp/build/host/README.html /tmp/site-host-README.html
          cp LICENSE /tmp/LICENSE
          cp flasher/index.html /tmp/flasher-index.html
          cp CNAME /tmp/CNAME

          # Check out or create the gh-pages branch
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          # Prevent Jekyll processing
          touch .nojekyll

          # Create firmware directory for this release
          mkdir -p "firmware/${tag}"

          # Download the release tarballs
          gh release download "${tag}" --pattern "*.tar.gz" --dir "firmware/${tag}"

          # Update the site: all documentation pages + flasher
          cp /tmp/site-index.html index.html
          cp /tmp/site-README.html README.html
          cp /tmp/site-BUILD.html BUILD.html
          cp /tmp/LICENSE LICENSE
          mkdir -p flasher components/dectalk host
          cp /tmp/flasher-index.html flasher/index.html
          cp /tmp/site-comp-README.html components/dectalk/README.html
          cp /tmp/site-comp-BUILD.html components/dectalk/BUILD.html
          cp /tmp/site-host-README.html host/README.html
          cp /tmp/CNAME CNAME

          # Commit and push
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy firmware ${tag} to GitHub Pages"
            git push origin gh-pages
          fi
