# Deploy the project site to GitHub Pages (gh-pages branch).
#
# Converts Markdown documentation to dark-themed HTML pages using Pandoc
# and pushes the result to the gh-pages branch, preserving any firmware
# files that were previously deployed by the release workflow.
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "BUILD.md"
      - "LICENSE"
      - "components/dectalk/README.md"
      - "components/dectalk/BUILD.md"
      - "host/README.md"
      - "host/web/**"
      - "pages/**"
      - "flasher/**"
      - ".github/workflows/deploy-site.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: Build HTML pages from Markdown
        run: |
          set -euo pipefail

          convert() {
            local src="$1" dst="$2" title="$3"
            python3 pages/strip-frontmatter.py --rewrite-links "$src" \
              | pandoc \
                  --from gfm \
                  --to html5 \
                  --template pages/template.html \
                  --metadata title="$title" \
                  --standalone \
                  --wrap=none \
                  --output "$dst"
          }

          mkdir -p /tmp/build/components/dectalk /tmp/build/host

          convert README.md                    /tmp/build/index.html                       "DECtalk ESPress"
          convert README.md                    /tmp/build/README.html                      "DECtalk ESPress"
          convert BUILD.md                     /tmp/build/BUILD.html                       "DECtalk ESPress — Build"
          convert components/dectalk/README.md /tmp/build/components/dectalk/README.html   "DECtalk Component"
          convert components/dectalk/BUILD.md  /tmp/build/components/dectalk/BUILD.html    "DECtalk Component — Build"
          convert host/README.md               /tmp/build/host/README.html                 "DECtalk Host Tools"

      - name: Prepare site files
        run: |
          set -euo pipefail

          mkdir -p /tmp/site/flasher /tmp/site/gui /tmp/site/components/dectalk /tmp/site/host

          # HTML pages converted from Markdown
          cp /tmp/build/index.html                      /tmp/site/index.html
          cp /tmp/build/README.html                     /tmp/site/README.html
          cp /tmp/build/BUILD.html                      /tmp/site/BUILD.html
          cp /tmp/build/components/dectalk/README.html  /tmp/site/components/dectalk/README.html
          cp /tmp/build/components/dectalk/BUILD.html   /tmp/site/components/dectalk/BUILD.html
          cp /tmp/build/host/README.html                /tmp/site/host/README.html

          # Static files
          cp LICENSE           /tmp/site/LICENSE
          cp flasher/index.html /tmp/site/flasher/index.html
          cp host/web/index.html /tmp/site/gui/index.html

      - name: Deploy to gh-pages
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check out or create the gh-pages branch
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          # Prevent Jekyll processing
          touch .nojekyll

          # Copy the built site (preserves existing firmware/ directory)
          cp /tmp/site/index.html index.html
          cp /tmp/site/README.html README.html
          cp /tmp/site/BUILD.html BUILD.html
          cp /tmp/site/LICENSE LICENSE
          mkdir -p flasher gui components/dectalk host
          cp /tmp/site/flasher/index.html flasher/index.html
          cp /tmp/site/gui/index.html gui/index.html
          cp /tmp/site/components/dectalk/README.html components/dectalk/README.html
          cp /tmp/site/components/dectalk/BUILD.html components/dectalk/BUILD.html
          cp /tmp/site/host/README.html host/README.html

          # Commit and push
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy site from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
