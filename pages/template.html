<!DOCTYPE html>

  Dark-themed Pandoc HTML template for DECtalk ESPress GitHub Pages.
  Used by the deploy-site and release workflows to convert Markdown to HTML.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$</title>
  <style>
    /* ── Colour palette (GitHub-dark inspired) ── */
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --heading:     #f0f6fc;
      --link:        #58a6ff;
      --link-hover:  #79c0ff;
      --code-bg:     #1c2128;
      --code-text:   #e6edf3;
      --accent:      #6c9ef8;
      --table-alt:   #161b22;
      --table-head:  #1c2128;
      --kbd-bg:      #2d333b;
      --blockquote:  #30363d;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Body ── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top navigation bar ── */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }
    .navbar a:hover { color: var(--link); }
    .navbar .brand {
      color: var(--heading);
      font-weight: 600;
      font-size: 0.95rem;
      margin-right: auto;
    }

    /* ── Main content area ── */
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem 4rem;
    }

    /* ── Typography ── */
    h1, h2, h3, h4, h5, h6 {
      color: var(--heading);
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
      line-height: 1.3;
      border-bottom: none;
    }
    h1 { font-size: 1.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
    h2 { font-size: 1.4rem;  padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    h3 { font-size: 1.15rem; }
    h4 { font-size: 1rem; }

    p { margin-bottom: 1rem; }

    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }

    strong { color: var(--heading); font-weight: 600; }

    /* ── Lists ── */
    ul, ol { margin: 0.5rem 0 1rem 1.5rem; }
    li { margin-bottom: 0.35rem; }
    li > ul, li > ol { margin-top: 0.25rem; margin-bottom: 0.25rem; }

    /* ── Code ── */
    code {
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas,
                   "Liberation Mono", Menlo, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      margin: 1rem 0;
      line-height: 1.5;
    }
    pre code {
      background: none;
      padding: 0;
      font-size: 0.85rem;
    }

    /* ── Tables ── */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      text-align: left;
    }
    th {
      background: var(--table-head);
      color: var(--heading);
      font-weight: 600;
    }
    tr:nth-child(even) { background: var(--table-alt); }

    /* ── Blockquotes ── */
    blockquote {
      border-left: 3px solid var(--accent);
      background: var(--surface);
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      border-radius: 0 6px 6px 0;
    }
    blockquote p { margin-bottom: 0.5rem; }
    blockquote p:last-child { margin-bottom: 0; }
    blockquote strong { color: var(--text); }

    /* ── Horizontal rules ── */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* ── Images ── */
    img { max-width: 100%; height: auto; border-radius: 6px; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }
    .footer a { color: var(--link); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .container { padding: 0 1rem 3rem; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.2rem; }
      table { font-size: 0.82rem; }
      th, td { padding: 0.45rem 0.55rem; }
      .navbar { padding: 0.5rem 1rem; gap: 1rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="/">DECtalk ESPress</a>
    <a href="/flasher/">Web Flasher</a>
    <a href="/gui/">Web GUI</a>
    <a href="https://github.com/lllucius/DECtalk_ESPress">GitHub</a>
    <a href="https://github.com/lllucius/DECtalk_ESPress/releases">Releases</a>
  </nav>

  <main class="container">
$body$
  </main>

  <footer class="footer">
    <p>
      <a href="https://github.com/lllucius/DECtalk_ESPress">DECtalk ESPress</a>
      — MIT License
    </p>
  </footer>

</body>
</html>
